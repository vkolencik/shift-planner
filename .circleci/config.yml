# Taken from here: https://circleci.com/blog/building-and-testing-an-asp-net-core-application/

version: 2.1

executors:
  dotnet-sdk:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:6.0
  node:
    docker:
      - image: node:18-alpine

jobs:
  test-backend:
    description: Setup and run application tests
    executor: dotnet-sdk
    working_directory: ~/project/backend
    steps:
      - checkout:
          path: ~/project
      #      - restore_cache:
      #          keys:
      #            - dotnet-packages-v1-{{ checksum "SimpleCalc/SimpleCalc.csproj" }}
      - run: dotnet restore
      #      - save_cache:
      #          paths:
      #            - C:\Users\circleci\.nuget\packages
      #          key: dotnet-packages-v1-{{ checksum "SimpleCalc/SimpleCalc.csproj" }}
      - run: dotnet build
      - run: dotnet test --no-build --logger "trx"
      - run:
          name: "Convert test results"
          when: always
          command: |
            dotnet tool install -g trx2junit
            export PATH="$PATH:/root/.dotnet/tools"
            trx2junit test/**/TestResults/*.trx --output test/TestResults/
      - store_test_results:
          path: test/TestResults
  build-cdk:
    description: Build CDK deployment script
    executor: node
    working_directory: ~/project/backend
    steps:
      - checkout:
          path: ~/project
      - run: npm ci
      - run: npm run build
  deploy-cdk:
    description: Build CDK deployment script
    executor: node
    working_directory: ~/project/backend
    steps:
      - checkout:
          path: ~/project
      - run: npm ci
      - run: npm run cdk deploy

workflows:
  test_and_build:
    jobs:
      - test-backend
      - build-cdk
      - deploy-cdk:
          requires:
            - test-backend
            - build-cdk
