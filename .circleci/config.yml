# Taken from here: https://circleci.com/blog/building-and-testing-an-asp-net-core-application/

version: 2.1

orbs:
  windows: circleci/windows@4.1.1

executors:
  dotnet-sdk:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:6.0

jobs:
  test:
    description: Setup and run application tests
    executor: dotnet-sdk
    working_directory: ~/project/backend
    steps:
      - checkout:
          path: ~/project
#      - restore_cache:
#          keys:
#            - dotnet-packages-v1-{{ checksum "SimpleCalc/SimpleCalc.csproj" }}
      - run:
          name: "Install project dependencies"
          command: dotnet restore
#      - save_cache:
#          paths:
#            - C:\Users\circleci\.nuget\packages
#          key: dotnet-packages-v1-{{ checksum "SimpleCalc/SimpleCalc.csproj" }}
      - run:
          name: "Run Application Tests"
          command: dotnet test -v n --results-directory:test_coverage --collect:"Code Coverage"
      - run:
          name: "Print Working Directory"
          command: pwd
      - store_artifacts:
          path: C:\Users\circleci\project\test_coverage

workflows:
  test_and_build:
    jobs:
      - test
      - build:
          requires:
            - test
