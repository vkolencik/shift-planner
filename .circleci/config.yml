# Taken from here: https://circleci.com/blog/building-and-testing-an-asp-net-core-application/

version: 2.1

executors:
  dotnet-sdk:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:6.0
  node:
    docker:
      - image: node:18-alpine

jobs:

  build-and-test-backend:
    description: Setup and run application tests
    executor: dotnet-sdk
    working_directory: ~/project/backend
    environment:
      AWS_DEFAULT_REGION: eu-central-1 
    steps:
      - checkout:
          path: ~/project
      #      - restore_cache:
      #          keys:
      #            - dotnet-packages-v1-{{ checksum "SimpleCalc/SimpleCalc.csproj" }}
      - run: dotnet restore
      #      - save_cache:
      #          paths:
      #            - C:\Users\circleci\.nuget\packages
      #          key: dotnet-packages-v1-{{ checksum "SimpleCalc/SimpleCalc.csproj" }}
      - run: dotnet build -c Release
      - run: dotnet test --no-build --logger "trx" -c Release
      - run:
          name: "Convert test results"
          when: always
          command: |
            dotnet tool install -g trx2junit
            export PATH="$PATH:/root/.dotnet/tools"
            trx2junit test/**/TestResults/*.trx --output test/TestResults/
      - store_test_results:
          path: test/TestResults
      - persist_to_workspace:
          root: .
          # Must be relative path from root
          paths:
            - src/ShiftPlanner.Api/bin/Release/net6.0

  test-frontend:
    description: Test frontend
    executor: node
    working_directory: ~/project/frontend
    steps:
      - checkout:
          path: ~/project
      - run: npm i
      - run: npm test

  build-cdk:
    description: Build CDK deployment script
    executor: node
    working_directory: ~/project/deployment
    steps:
      - checkout:
          path: ~/project
      - run: npm ci
      - run: npm run build

  deploy-cdk:
    description: Build CDK deployment script
    executor: node
    working_directory: ~/project/deployment
    steps:
      - checkout:
          path: ~/project
      - attach_workspace:
          # Must be absolute path or relative path from working_directory
          at: ../backend
      - run: npm ci
      - run: npm run cdk deploy -- --require-approval never

  integration-test-backend:
    description: Runs integration test suite against deployed backend
    executor: node
    working_directory: ~/project/backend/integration-tests
    steps:
      - checkout:
          path: ~/project
      - run: npm ci
      - run: npm run test:prod

workflows:
  test_and_build:
    jobs:
      - build-and-test-backend
      - build-cdk
      - test-frontend
      - deploy-cdk:
          requires:
            - build-and-test-backend
            - build-cdk
      - integration-test-backend:
          requires:
            - deploy-cdk
